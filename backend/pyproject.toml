[project]
name = "myseoapp-backend"
version = "0.1.0"
description = "MySEOapp — unified SEO engine (crawl/audit, on-page, keywords, rankings, reporting, integrations)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
