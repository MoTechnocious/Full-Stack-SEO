# Alembic configuration for the MySEOapp backend.
#
# The database URL is NOT set here — alembic/env.py reads it from the app
# Settings (SEO_DATABASE_URL, default sqlite:///./myseoapp.db) so migrations
# always target the same database the application uses.
#
# Run from the backend/ directory, e.g.:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
